<text x="28" y="61" font-size="14" fill="#516174">4096³ matmul · full → warm quick → cold quick · lower is better</text>
<text x="28" y="104" font-size="17" font-weight="600">End-to-end run time</text>
<text x="28" y="154" font-size="14" >Cold full</text>
