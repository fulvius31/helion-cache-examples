<text x="176" y="289" font-size="12" fill="#64748b">0</text>
<text x="450" y="289" font-size="12" fill="#64748b" text-anchor="end">300 s</text>
<text x="548" y="104" font-size="17" font-weight="600">Measured kernel time</text>
<text x="548" y="154" font-size="14" >Cold full</text>
<rect x="696" y="135" width="274" height="27" rx="3" fill="#e5ebf1"/>
<rect x="696" y="135" width="195.80" height="27" rx="3" fill="#526782"/>
