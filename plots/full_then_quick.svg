<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
<title id="title">Reuse a full-search winner during quick re-tuning</title>
<desc id="desc">4096³ matmul · full → warm quick → cold quick · lower is better Warm quick: 45.8 s versus 225.7 s full (4.9× less wall time), at comparable kernel latency. Different efforts and a fixed run order: this is not a 4.9× speedup attributable to warm-start alone.</desc>
<rect width="1040" height="390" rx="12" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#17293c">
